<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسابقة مناهج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d2b2e; --teal:#0f5c5f; --teal2:#14797c; --mint:#e6f2ef; --paper:#f7f5ef;
  --gold:#c8962e; --gold2:#f0c565; --line:#d9dfdc; --muted:#5d6f70;
  --a:#1d5fbf; --aBg:#e7effc; --b:#d4651a; --bBg:#fdeee3; --ok:#1f8a4c; --bad:#b83a3a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Tajawal",system-ui,sans-serif;color:var(--ink);background:var(--paper);
  background-image:radial-gradient(circle at 15% 10%,rgba(20,121,124,.08),transparent 40%),radial-gradient(circle at 90% 90%,rgba(200,150,46,.10),transparent 45%);
  min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,.disp{font-family:"Changa",sans-serif}
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px 28px;background:var(--teal);color:#fff;
  border-bottom:4px solid var(--gold)}
header.top .logo{height:112px;width:auto;max-width:170px;object-fit:contain;background:#fff;border-radius:14px;padding:8px 12px;display:none;justify-self:start;box-shadow:0 4px 14px rgba(0,0,0,.15)}
header.top .logo.show{display:block}
header.top .t{flex:1;text-align:center}
header.top .t h1{margin:0;font-size:28px;letter-spacing:.5px}
header.top .t small{opacity:.85;font-size:15px}
.tools{position:fixed;bottom:14px;left:14px;display:flex;gap:8px;z-index:40}
.tools button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.06)}
main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:28px 24px 80px}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);margin-bottom:18px;font-size:16px;flex-wrap:wrap}
.crumbs a{color:var(--teal2);cursor:pointer;text-decoration:none;font-weight:700}
.sec-title{font-size:30px;margin:0 0 6px}
.sec-sub{color:var(--muted);margin:0 0 26px;font-size:17px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;
  transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(15,92,95,.14);border-color:var(--teal2)}
.card .big{font-family:"Changa";font-size:64px;line-height:1;color:var(--teal);font-weight:800}
.card .nm{font-family:"Changa";font-size:24px;margin-top:10px;font-weight:700}
.card .meta{color:var(--muted);margin-top:8px;font-size:15px}
.card .band{position:absolute;inset:0 0 auto 0;height:6px;background:var(--gold)}
.card .ic{font-size:52px;line-height:1}
.partner{justify-self:end;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border-radius:14px;padding:6px 14px 8px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.partner span{font-family:"Changa";font-size:13px;font-weight:700;color:var(--muted)}
.partner img{height:74px;width:auto;max-width:200px;object-fit:contain}
.pill{display:inline-block;background:var(--mint);color:var(--teal);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.pill.empty{background:#f3e9e9;color:var(--bad)}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px}
.row{display:flex;gap:18px;flex-wrap:wrap}
.row>*{flex:1;min-width:260px}
label.f{display:block;font-weight:700;margin:0 0 6px;font-size:15px}
input.t,textarea.t,select.t{width:100%;font-family:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input.t:focus,textarea.t:focus,select.t:focus{outline:none;border-color:var(--teal2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:16px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.btn{border:none;border-radius:14px;padding:14px 26px;font-size:19px;font-weight:800;background:var(--teal);color:#fff}
.btn:hover{background:var(--teal2)}
.btn.gold{background:var(--gold);color:#1d1606}
.btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
/* game */
.board{display:grid;gap:14px;margin-bottom:18px}
.score{--c:#1d5fbf;--bg:#e7effc;background:var(--bg);border:3px solid var(--c);border-radius:20px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:transform .2s;min-width:0}
.score .n{font-family:"Changa";font-size:24px;font-weight:700;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .p{font-family:"Changa";font-size:54px;font-weight:800;line-height:1;color:var(--c);min-width:60px;text-align:center}
.score .rt{display:flex;align-items:center;gap:6px}
.score .adj{display:flex;flex-direction:column;gap:4px}
.score .adj button{border:none;background:rgba(255,255,255,.85);border-radius:8px;width:28px;height:24px;font-size:16px;font-weight:800;color:var(--muted)}
.board.many .score{flex-direction:column;justify-content:center;text-align:center;padding:10px 8px}
.board.many .score .n{font-size:19px;max-width:100%}
.board.many .score .p{font-size:46px}
.board.many .score .adj{flex-direction:row}
.score.lead{transform:scale(1.03);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.score.pop .p{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.qcard{background:#fff;border-radius:26px;border:1px solid var(--line);padding:34px 40px 30px;text-align:center;box-shadow:0 10px 40px rgba(13,43,46,.07);position:relative}
.qcard .tag{position:absolute;top:16px;right:20px}
.qnum{position:absolute;top:14px;left:18px;background:var(--teal);color:#fff;border-radius:12px;padding:6px 14px;font-size:14px}
.qnum b{font-family:"Changa";font-size:20px;margin:0 4px}
.qtext{font-family:"Changa";font-size:clamp(28px,3.6vw,48px);transition:font-size .2s;font-weight:700;line-height:1.55;margin:26px 0 10px}
.qcard.drawing .ans,.qcard.drawing .award,.qcard.drawing #revealWrap,.qcard.drawing .timer,.qcard.drawing .tnum,.qcard.drawing .tag{visibility:hidden}
.dice{display:inline-block;font-size:64px;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.roll{font-family:"Changa";font-size:90px;font-weight:800;color:var(--teal);line-height:1.1}
.roll.hit{color:var(--gold);animation:pop .6s}
.qcard.sz-s .qtext{font-size:clamp(22px,2.6vw,34px)}
.qcard.sz-l .qtext{font-size:clamp(38px,5vw,70px);line-height:1.45}
.qcard.sz-s .ans{font-size:clamp(18px,2vw,26px)}
.qcard.sz-l .ans{font-size:clamp(28px,3.4vw,46px)}
.szbox{position:absolute;bottom:14px;left:18px;display:flex;gap:4px}
.szbox button{border:1.5px solid var(--line);background:#fff;border-radius:8px;min-width:34px;height:30px;font-weight:800;color:var(--muted);font-family:"Changa"}
.szbox button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.timer{width:100%;height:10px;background:#eef1ef;border-radius:999px;overflow:hidden;margin:20px 0 4px}
.timer i{display:block;height:100%;background:var(--teal2);width:100%;transition:width 1s linear}
.timer.warn i{background:var(--bad)}
.tnum{font-family:"Changa";font-size:22px;color:var(--muted)}
.ans{margin-top:22px;border-radius:18px;background:var(--mint);border:2px dashed var(--teal2);padding:20px;font-size:clamp(22px,2.6vw,34px);font-weight:800;color:var(--teal);display:none}
.ans.show{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.award{display:grid;gap:12px;margin-top:22px}
.award button{border:none;border-radius:16px;padding:16px 10px;font-size:21px;font-weight:800;color:#fff;background:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.award button:disabled{opacity:.4;cursor:default}
.hint{color:var(--muted);font-size:14px;text-align:center;margin-top:14px}
.final{text-align:center}
.final .crown{font-size:84px}
.final h2{font-size:44px;margin:6px 0}
.final .fs{display:flex;gap:16px;justify-content:center;margin:26px 0;flex-wrap:wrap}
.final .fs div{border-radius:20px;padding:16px 30px;font-family:"Changa";background:var(--bg);color:var(--c);border:3px solid transparent;min-width:150px}
.final .fs div.win{border-color:var(--gold)}
.final .fs b{display:block;font-size:58px;line-height:1.1}
.final .fs i{font-style:normal;font-size:30px;display:block}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}
.team-in{border-radius:16px;padding:14px;border:2px solid var(--c);background:var(--bg)}
.team-in label{color:var(--c)}
/* admin */
.qlist{margin-top:14px;display:flex;flex-direction:column;gap:8px;max-height:460px;overflow:auto}
.qi{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}
.qi .x{flex:1}
.qi .x b{display:block}
.qi .x span{color:var(--teal2)}
.qi button.ed{background:var(--mint);color:var(--teal)}
.qi.edit{background:#fbfcfb;border-color:var(--teal2)}
.qi .pill{align-self:center}
.pill{align-self:center}
.qi .btn{border:none}
.qi .btn.sm{background:var(--teal);color:#fff;padding:8px 16px}
.qi .btn.ghost.sm{background:#fff;color:var(--teal);border:1.5px solid var(--line)}
.qi button{border:none;background:#f6e6e6;color:var(--bad);border-radius:8px;padding:6px 10px;font-weight:700}
.drop{border:2px dashed var(--teal2);border-radius:16px;padding:30px;text-align:center;background:var(--mint);cursor:pointer}
.drop.over{background:#d3ebe5}
.qi.imp input.t{font-size:16px;padding:8px 10px}
.note{background:#fff8e6;border:1px solid #f0d99a;border-radius:12px;padding:10px 14px;color:#6b5414;font-size:15px;margin-bottom:16px}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.modal{position:fixed;inset:0;background:rgba(13,43,46,.5);display:none;align-items:center;justify-content:center;z-index:70}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:18px;padding:26px;max-width:420px;text-align:center}
@media (max-width:760px){
  .board,.award{grid-template-columns:1fr 1fr!important}
  .qcard{padding:26px 18px}
  header.top{padding:10px 14px;grid-template-columns:auto 1fr auto}.partner img{height:40px;max-width:110px}.partner span{font-size:10px}.partner{padding:4px 6px}header.top .logo{height:64px;padding:4px 6px}header.top .t h1{font-size:22px}
}
</style>
</head>
<body>
<header class="top">
  <img class="logo" id="logoMoe" alt="شعار وزارة التعليم">
  <div class="t"><h1>مسابقة «مناهج»</h1><small>مدرسة سعد بن أبي وقاص الابتدائية</small></div>
  <div class="partner" id="partner"><span>بالشراكة مع</span><img id="logoAssoc" alt="جمعية التنمية الأهلية بعنيزة"></div>
</header>
<main id="app"></main>
<div class="tools">
  <button id="fsBtn">⛶ ملء الشاشة</button>
  <button id="homeBtn">⌂ الرئيسية</button>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><div id="modalMsg" style="font-size:19px;font-weight:700;margin-bottom:18px"></div>
  <div class="actions" style="margin-top:0"><button class="btn sm" id="mYes">نعم</button><button class="btn ghost sm" id="mNo">إلغاء</button></div></div></div>
<canvas id="confetti"></canvas>

/* Supabase (للنسخة المستقلة على Render) — اتركها فارغة للحفظ المحلي */
const SB={url:"__SB_URL__",key:"__SB_KEY__"};
const SB_ON=/^https:\/\//.test(SB.url)&&SB.key.length>20;
let sbLast=0;
function sbHeaders(){return {apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":"application/json"}}
async function sbLoad(){
  if(!SB_ON)return; sbLast=Date.now();
  try{const r=await fetch(SB.url+"/rest/v1/manahij_banks?select=key,items,over",{headers:sbHeaders()});
    if(!r.ok)throw new Error(r.status);
    const rows=await r.json(), next={}, nextO={};
    rows.forEach(x=>{next[x.key]=x.items||[];nextO[x.key]=x.over||{}});
    custom=next; over=nextO; saveLocal(); if(view.rerender) view.rerender();
  }catch(e){console.warn(e);toast("تعذّر الاتصال بقاعدة البيانات، يُعرض المحفوظ على هذا الجهاز")}
}
if(SB_ON){storeMode="db";sbLoad();setInterval(()=>{if(!document.hidden&&!$("#award"))sbLoad()},30000)}
(async()=>{
  try{
    if(SB_ON||!window.claude||!claude.use) return;
    const d = await claude.use("db"); if(!d) return;
    db=d; storeMode="db";
    db.collection("banks").onSnapshot(snap=>{
      const next={},nextO={};
      (snap.docs||snap).forEach(doc=>{const data=typeof doc.data==="function"?doc.data():doc.data; const id=doc.id; if(!data)return; if(Array.isArray(data.items)) next[id]=data.items; if(data.over&&typeof data.over==="object") nextO[id]=data.over});
      custom=next; over=nextO; saveLocal(); if(view.rerender) view.rerender();
    },err=>{console.warn(err)});
  }catch(e){console.warn(e)}
})();
async function saveBank(key){
  saveLocal();
  if(SB_ON){try{const r=await fetch(SB.url+"/rest/v1/manahij_banks",{method:"POST",headers:{...sbHeaders(),Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify([{key,items:custom[key]||[],over:over[key]||{},updated_at:new Date().toISOString()}])});if(!r.ok)throw new Error(r.status)}
    catch(e){console.warn(e);toast("تعذّر الحفظ في قاعدة البيانات، حُفظ على هذا الجهاز فقط")}return}
  if(db){try{await db.collection("banks").doc(key).set({items:custom[key]||[],over:over[key]||{}})}catch(e){toast("تعذّر الحفظ في قاعدة البيانات، حُفظ على هذا الجهاز فقط")}}
}

function bankKey(g,s){return "g"+g+"-"+s}
function getStages(g,s){
  const k=bankKey(g,s), out={};
  const b=BUILTIN[k]||{};
  const ov=over[k]||{};
  for(const st in b){out[st]=[];b[st].forEach(([q,a],i)=>{const id="b:"+st+":"+i,o=ov[id];if(o&&o.del)return;
    out[st].push({q:o&&o.q||q,a:o&&o.a||a,src:"b",id,num:i+1,edited:!!(o&&(o.q||o.a))})})}
  const nextNum={};(custom[k]||[]).forEach((it,i)=>{const st=it.stage;nextNum[st]=nextNum[st]||((b[st]||[]).length+1);
    (out[st]=out[st]||[]).push({q:it.q,a:it.a,src:"c",idx:i,id:"c:"+i,num:nextNum[st]++})});
  for(const st in out){if(!out[st].length)delete out[st]}
  return out;
}
function countAll(g,s){return Object.values(getStages(g,s)).reduce((n,a)=>n+a.length,0)}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- game ---------- */
let G=null, tHandle=null;
function stopTimer(){clearInterval(tHandle);tHandle=null}
let actx=null;
function beep(freqs,dur=.12){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;
  freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type="triangle";g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur);t+=dur*.9})}catch(e){}}

function startGame(cfg){G={...cfg,i:0,score:cfg.teams.map(()=>0),revealed:false,awarded:false,history:[],drawn:{}};go(renderQ)}
function renderQ(){
  stopTimer();
  const q0=G.pool[G.i], q={...q0,q:EN(q0.q),a:EN(q0.a)}, s=SUBJECTS.find(x=>x.id===sel.subject), g=GRADES.find(x=>x.id===sel.grade);
  const N=G.teams.length, max=Math.max(...G.score), leaders=G.score.filter(x=>x===max).length;
  const cols=N<=3?N:(N===4?4:N);
  app.innerHTML=`
  <div class="board ${N>3?"many":""}" style="grid-template-columns:repeat(${cols},1fr)">
    ${G.teams.map((nm,i)=>`<div class="score ${max>0&&G.score[i]===max&&leaders<N?"lead":""}" id="sc${i}" style="${tc(i)}"><div class="n" title="${esc(nm)}">${esc(nm)}</div>
      <div class="rt"><div class="p">${G.score[i]}</div><div class="adj"><button data-adj="${i},1">+</button><button data-adj="${i},-1">−</button></div></div></div>`).join("")}
  </div>
  <div class="qcard sz-${G.size||"m"}">
    <div class="szbox" title="حجم السؤال">${[["s","ص"],["m","م"],["l","ك"]].map(([k,l])=>`<button data-sz="${k}" class="${(G.size||"m")===k?"on":""}">${l}</button>`).join("")}</div>
    <div class="qnum">السؤال<b>${G.i+1} / ${G.pool.length}</b>${s.nm} · ${g.nm}</div>
    <span class="pill tag">${G.multiStage?(STAGE_NM[q.stage]||"المرحلة "+q.stage)+" · ":""}رقمه في البنك: ${q.num}</span>
    <div class="qtext" id="qtext">${esc(q.q)}</div>
    ${G.timer?`<div class="timer" id="tbar"><i></i></div><div class="tnum" id="tnum">${G.timer}</div>`:""}
    <div class="ans ${G.revealed?"show":""}" id="ans">✔ ${esc(q.a)}</div>
    <div class="actions" id="revealWrap" style="${G.revealed?"display:none":""}"><button class="btn" id="revealBtn">إظهار الإجابة</button></div>
    <div class="award" id="award" style="grid-template-columns:repeat(${Math.min(N,3)},1fr)">
      ${G.teams.map((nm,i)=>`<button data-w="${i}" style="${tc(i)}" ${G.awarded?"disabled":""}>✓ ${esc(nm)}</button>`).join("")}
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn ghost sm" data-w="-1" ${G.awarded?"disabled":""}>✗ لم يُجب أحد</button>
      ${G.history.length?`<button class="btn ghost sm" id="undoBtn">↶ تراجع</button>`:""}
      <button class="btn ${G.awarded?"":"ghost"} sm" id="skipBtn">${G.awarded?"السؤال التالي ←":"تخطٍّ ←"}</button>
      <button class="btn ghost sm" id="endBtn">إنهاء المسابقة</button>
    </div>
    <div class="hint">اختصارات: مسافة = إظهار الإجابة · ${G.teams.map((nm,i)=>`${i+1} = ${esc(nm)}`).join(" · ")} · 0 = لم يُجب أحد · ← = التالي</div>
  </div>`;
  $("#revealBtn")&&($("#revealBtn").onclick=reveal);
  app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>award(+b.dataset.w));
  app.querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{const [t,d]=b.dataset.adj.split(",").map(Number);G.score[t]=Math.max(0,G.score[t]+d);renderQ()});
  $("#skipBtn").onclick=next; $("#endBtn").onclick=async()=>{if(await confirmBox("إنهاء المسابقة وعرض النتيجة؟"))finish()};
  $("#undoBtn")&&($("#undoBtn").onclick=undo);
  app.querySelectorAll("[data-sz]").forEach(b=>b.onclick=()=>{G.size=setupState.size=b.dataset.sz;const c=$(".qcard");c.classList.remove("sz-s","sz-m","sz-l");c.classList.add("sz-"+G.size);
    app.querySelectorAll("[data-sz]").forEach(x=>x.classList.toggle("on",x.dataset.sz===G.size))});
  if(G.random&&!G.drawn[G.i]){drawAnim();return}
  if(G.timer&&!G.revealed&&!G.awarded) runTimer(); else if(G.timer){$("#tbar").style.visibility="hidden";$("#tnum").style.visibility="hidden"}
}
function drawAnim(){
  const card=$(".qcard"); card.classList.add("drawing");
  const tag=card.querySelector(".tag"), qt=$("#qtext"), max=Math.max(...G.pool.map(x=>x.num));
  qt.innerHTML=`<span class="dice">🎲</span><div class="roll">?</div><div class="sec-sub" style="margin:0">سحب سؤال عشوائي…</div>`;
  const roll=qt.querySelector(".roll"); let n=0; const myI=G.i;
  const h=setInterval(()=>{if(!roll.isConnected||G.i!==myI){clearInterval(h);return}roll.textContent=1+Math.floor(Math.random()*max);if(++n%2)beep([300+Math.random()*500],.04)},70);
  setTimeout(()=>{clearInterval(h);if(G.i!==myI||!roll.isConnected)return;roll.textContent=G.pool[G.i].num;roll.classList.add("hit");beep([784,1046],.12);
    setTimeout(()=>{if(G.i!==myI)return;G.drawn[G.i]=true;renderQ()},650)},1100);
}
function runTimer(){
  let left=G.timer; const bar=$("#tbar i"),num=$("#tnum");
  requestAnimationFrame(()=>{bar.style.width="100%"});
  tHandle=setInterval(()=>{left--; if(!bar.isConnected){stopTimer();return}
    bar.style.width=(left/G.timer*100)+"%"; num.textContent=Math.max(0,left);
    if(left<=5) $("#tbar").classList.add("warn"); if(left<=5&&left>0) beep([880],.08);
    if(left<=0){stopTimer();num.textContent="انتهى الوقت";beep([440,330],.25)}
  },1000);
}
function reveal(){if(G.revealed)return;G.revealed=true;stopTimer();$("#ans").classList.add("show");$("#revealWrap").style.display="none"}
function award(w){
  if(G.awarded||w>=G.teams.length)return; G.awarded=true; G.revealed=true; G.drawn[G.i]=true;
  G.history.push({i:G.i,w,pts:w>=0?G.points:0});
  if(w>=0){G.score[w]+=G.points;beep([660,880,1100],.11)}
  renderQ(); if(w>=0){$("#sc"+w).classList.add("pop")}
}
function undo(){const h=G.history.pop();if(!h)return; if(h.w>=0)G.score[h.w]-=h.pts; G.i=h.i;G.awarded=false;G.revealed=false;renderQ()}
function next(){if(G.i>=G.pool.length-1){finish();return}G.i++;G.revealed=false;G.awarded=false;renderQ()}
function finish(){stopTimer();
  const max=Math.max(...G.score), winners=G.teams.filter((_,i)=>G.score[i]===max);
  const order=G.teams.map((nm,i)=>({nm,i,s:G.score[i]})).sort((a,b)=>b.s-a.s);
  const ranks=order.map(o=>1+order.filter(x=>x.s>o.s).length), medal=r=>["🥇","🥈","🥉"][r-1]||r;
  const tie=winners.length>1||max===0;
  app.innerHTML=`<div class="panel final">
    <div class="crown">${tie?"🤝":"🏆"}</div>
    <h2>${max===0?"لم يحصل أي فريق على نقاط":winners.length>1?"تعادل في الصدارة: "+winners.map(esc).join(" و"):"الفائز: "+esc(winners[0])}</h2>
    <p class="sec-sub">${G.history.length} سؤالًا أُجيب عنها من ${G.pool.length}</p>
    <div class="fs">${order.map((o,k)=>`<div class="${o.s===max&&max>0?"win":""}" style="${tc(o.i)}"><i>${medal(ranks[k])}</i>${esc(o.nm)}<b>${o.s}</b></div>`).join("")}</div>
    <div class="actions"><button class="btn gold" id="again">مسابقة جديدة في المادة نفسها</button><button class="btn ghost" id="toHome">العودة للصفوف</button></div></div>`;
  $("#again").onclick=setup; $("#toHome").onclick=home;
  if(max>0){confetti();beep([523,659,784,1046],.18)}
}

    const items=parseQA(lines);
    if(!items.length){out.innerHTML=`<div class="note" style="margin-top:16px">لم أجد أسئلة بصيغة معروفة في الملف. اكتب كل سؤال بصيغة «س1: ... ج1: ...» أو «السؤال | الإجابة».</div>`;return}
    out.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;flex-wrap:wrap;gap:8px"><b>وُجد ${items.length} سؤالًا — راجعها وعدّل ما يلزم قبل الإضافة إلى ${STAGE_NM[addStage]}</b>
      <label style="font-weight:700"><input type="checkbox" id="impAll" checked> تحديد الكل</label></div>
      <div class="qlist">${items.map((x,i)=>`<div class="qi imp"><input type="checkbox" class="impC" data-i="${i}" checked style="width:20px;height:20px;margin-top:10px">
        <div class="x"><input class="t impQ" value="${esc(x.q)}"><input class="t impA" value="${esc(x.a)}" style="margin-top:6px;color:var(--teal2)"></div></div>`).join("")}</div>
      <div class="actions"><button class="btn" id="impGo">إضافة الأسئلة المحددة</button></div>`;
    $("#impAll").onchange=e=>app.querySelectorAll(".impC").forEach(c=>c.checked=e.target.checked);
    $("#impGo").onclick=async()=>{let n=0;custom[key]=custom[key]||[];
      app.querySelectorAll(".qi.imp").forEach(r=>{if(!r.querySelector(".impC").checked)return;const q=r.querySelector(".impQ").value.trim(),a=r.querySelector(".impA").value.trim();if(q&&a){custom[key].push({q:EN(q),a:EN(a),stage:addStage});n++}});
      if(!n){toast("لم تحدد أي سؤال");return}await saveBank(key);toast(`أُضيف ${n} سؤالًا ✓`);tab="list";render()};
  }
  const keepScroll=fn=>async(...a)=>{const l=$("#qlist"),y=l?l.scrollTop:0;await fn(...a);const l2=$("#qlist");if(l2)l2.scrollTop=y};
  if($("#srch")){$("#srch").oninput=e=>{search=e.target.value;const pos=e.target.selectionStart;render();const s2=$("#srch");s2.focus();s2.setSelectionRange(pos,pos)}}
  app.querySelectorAll("[data-ls]").forEach(b=>b.onclick=()=>{listStage=b.dataset.ls;render()});
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=keepScroll(()=>{editId=b.dataset.edit;render();$("#eq")&&$("#eq").focus()}));
  app.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=keepScroll(()=>{editId=null;render()}));
  app.querySelectorAll("[data-save]").forEach(b=>b.onclick=keepScroll(async()=>{const id=b.dataset.save,q=EN($("#eq").value.trim()),a=EN($("#ea").value.trim());
    if(!q||!a){toast("السؤال والإجابة مطلوبان");return}
    if(id.startsWith("c:")){const it=custom[key][+id.slice(2)];it.q=q;it.a=a;if($("#es"))it.stage=$("#es").value}
    else{(over[key]=over[key]||{})[id]={q,a}}
    editId=null;await saveBank(key);toast("حُفظ التعديل ✓");render()}));
  app.querySelectorAll("[data-revert]").forEach(b=>b.onclick=keepScroll(async()=>{delete (over[key]||{})[b.dataset.revert];editId=null;await saveBank(key);toast("أُرجع النص الأصلي");render()}));
  if($("#restoreDel")) $("#restoreDel").onclick=async()=>{const o=over[key]||{};for(const id in o)if(o[id].del)delete o[id];await saveBank(key);toast("استُعيدت الأسئلة المحذوفة");render()};
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=keepScroll(async()=>{if(!await confirmBox("حذف هذا السؤال؟"))return;const id=b.dataset.del;
    if(id.startsWith("c:")){custom[key].splice(+id.slice(2),1)}else{(over[key]=over[key]||{})[id]={del:true}}
    if(editId===id)editId=null;await saveBank(key);render()}));
  };
  view.rerender=()=>{if(editId===null&&(!document.activeElement||!/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)))render()};render();
})}

/* ---------- file import ---------- */
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return}const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function pdfPageLines(items){
  items=items.filter(it=>it.str.trim()).map(it=>({x:it.transform[4],w:it.width||0,y:it.transform[5],s:it.str}));
  if(!items.length)return [];
  const minX=Math.min(...items.map(i=>i.x)),maxX=Math.max(...items.map(i=>i.x+i.w)),mid=(minX+maxX)/2;
  const group=list=>{const rows=[];list.forEach(it=>{let r=rows.find(r=>Math.abs(r.y-it.y)<3);if(!r){r={y:it.y,items:[]};rows.push(r)}r.items.push(it)});
    return rows.sort((a,b)=>b.y-a.y).map(r=>r.items.sort((a,b)=>b.x-a.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim())};
  const rows=group(items).length, crossing=items.filter(i=>i.x<mid-4&&i.x+i.w>mid+4).length;
  const right=items.filter(i=>i.x>=mid), left=items.filter(i=>i.x+i.w<=mid);
  // two-column layout (e.g. a two-column table): read the right column fully, then the left one
  if(crossing<=rows*0.1&&right.length>3&&left.length>3) return [...group(right),...group(left)];
  return group(items);
}
function fixPdfArabic(s){return s.replace(/\s*\^\s*/g,"").replace(/األ/g,"الأ").replace(/اإل/g,"الإ").replace(/اآل/g,"الآ").replace(/أل(?=[\u0621-\u064A])/g,m=>m)}
async function readFileLines(f){
  const buf=await f.arrayBuffer(), name=f.name.toLowerCase();
  if(name.endsWith(".pdf")||f.type==="application/pdf"){
    const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/";
    await loadScript(base+"pdf.min.js"); await loadScript(base+"pdf.worker.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:buf,disableWorker:true}).promise; const lines=[];
    for(let p=1;p<=pdf.numPages;p++){const tc=await (await pdf.getPage(p)).getTextContent();
      lines.push(...pdfPageLines(tc.items));}
    return lines.map(fixPdfArabic);
  }
  if(name.endsWith(".docx")){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const zip=await JSZip.loadAsync(buf), xml=await zip.file("word/document.xml").async("string");
    const doc=new DOMParser().parseFromString(xml,"application/xml"), W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
    return [...doc.getElementsByTagNameNS(W,"p")].map(p=>{let s="";p.querySelectorAll("*").forEach(n=>{if(n.localName==="t")s+=n.textContent;else if(n.localName==="tab")s+=" | ";else if(n.localName==="br")s+="\n"});return s}).flatMap(s=>s.split("\n")).map(s=>s.trim()).filter(Boolean);
  }
  throw new Error("unsupported");
}
function parseQA(lines){
  lines=lines.map(l=>EN(l).replace(/\u200f|\u200e/g,"").trim()).filter(Boolean);
  const text=lines.join("\n");
  // 1) numbered markers  س1: ... ج1: ...
  const re=/(?:^|[\s|])(س|سؤال|السؤال|ج|جواب|الجواب|الإجابة|الاجابة)\s*\(?(\d+)\)?\s*[:：\-–]/g;
  const marks=[];let m;while((m=re.exec(text))){marks.push({kind:/^(س|سؤال|السؤال)$/.test(m[1])?"q":"a",n:+m[2],start:m.index,end:re.lastIndex})}
  if(marks.filter(x=>x.kind==="q").length>=2){const Q={},A={};
    marks.forEach((mk,i)=>{const seg=text.slice(mk.end,i+1<marks.length?marks[i+1].start:text.length).replace(/\s+/g," ").replace(/^\s*\|\s*|\s*\|\s*$/g,"").trim();(mk.kind==="q"?Q:A)[mk.n]=(((mk.kind==="q"?Q:A)[mk.n]||"")+" "+seg).trim()});
    const out=Object.keys(Q).map(Number).sort((a,b)=>a-b).filter(n=>A[n]).map(n=>({q:Q[n],a:A[n]}));if(out.length)return out;}
  // 2) unnumbered  س: ... / ج: ...
  const out=[];let cur=null;
  lines.forEach(l=>{let mm;
    if((mm=l.match(/^(?:س|سؤال|السؤال)\s*[:：\-–]\s*(.+)/))){cur={q:mm[1],a:""};out.push(cur)}
    else if((mm=l.match(/^(?:ج|جواب|الجواب|الإجابة|الاجابة)\s*[:：\-–]\s*(.+)/))&&cur&&!cur.a){cur.a=mm[1]}});
  if(out.filter(x=>x.a).length>=2)return out.filter(x=>x.a);
  // 3) separator  السؤال | الإجابة
  const sep=lines.map(l=>l.split(/\s*\|\s*/).filter(Boolean)).filter(p=>p.length>=2).map(p=>({q:p[0].replace(/^\d+\s*[.\-)]\s*/,""),a:p.slice(1).join(" | ")}));
  if(sep.length>=2)return sep;
  // 4) a question ending with ؟ followed by an answer line
  const qa=[];for(let i=0;i<lines.length-1;i++){if(/[؟?]\s*$/.test(lines[i])&&!/[؟?]\s*$/.test(lines[i+1])){qa.push({q:lines[i].replace(/^\d+\s*[.\-)]\s*/,""),a:lines[i+1].replace(/^(?:الإجابة|الجواب|ج)\s*[:：]\s*/,"")});i++}}
  return qa;
}

document.addEventListener("keydown",e=>{
  if(!G||!$("#award")||$(".qcard.drawing")||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key;
  if(k===" "){e.preventDefault();G.revealed?(G.awarded&&next()):reveal()}
  else if(/^[0-9٠-٩]$/.test(k)){const n=+EN(k);award(n===0?-1:n-1)}
  else if(k==="ArrowLeft")next();
});

$("#fsBtn").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast("ملء الشاشة غير متاح هنا"))}catch(e){toast("ملء الشاشة غير متاح هنا")}};

function confetti(){const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#c8962e","#0f5c5f","#1d5fbf","#d4651a","#f0c565","#1f8a4c"];
  const ps=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:cols[Math.random()*6|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6}));
  let f=0;const my=++confRun;(function tick(){if(my!==confRun){x.clearRect(0,0,c.width,c.height);return}x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});
    if(++f<260)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}

home();
